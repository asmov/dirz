[package]
name = "dirz-lib"
version = "0.1.0"
edition = "2021"

[features]
default = ["libgit2"]
libgit2 = ["dep:git2"]
gitcmd = []

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
lazy_static = "1"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5.9"
bincode = { version = "2.0.0-rc", features = ["serde"] }
gix = { version = "0.37", features = [ "blocking-network-client", "blocking-http-transport-reqwest" ] }
git2 = { optional = true, version = "0.16" }
snafu = "0.7.1"

[dev-dependencies]
fs_extra = "1.3"
shutdown_hooks = "0.1"
